name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for leaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact
      - uses: mapringg/standard/.github/actions/check-pr@2da38877f9f3361e0847f11aa0c7b581163b6b10 # v1.11.0
      - run: |
          bash -n apple.sh && bash -n desktop.sh && bash -n ubuntu.sh
      - shell: pwsh
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows.ps1", [ref]$null, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }
